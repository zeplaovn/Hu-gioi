name: Build temporary Edge deployment bundle
on:
  push:
    branches:
      - ops/edge-bundle-deploy-20261110
    paths:
      - .github/workflows/edge-bundle-build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build:edge
      - name: Publish generated bundle to isolated deployment branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f supabase/functions/api/game.bundle.mjs
          git diff --cached --quiet || git commit -m 'build(edge): temporary deploy bundle (never merge)'
          git push origin HEAD:refs/heads/ops/edge-bundle-deploy-20261110
