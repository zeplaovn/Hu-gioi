name: Build and manually deploy Supabase Edge API
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean source (bundle is not tracked)
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and run required verification
        run: npm ci && npm run check && npm test && npm run build:min
      - name: Generate Edge bundle locally, never commit it
        shell: bash
        run: |
          set -euo pipefail
          npm run build:edge
          test -s supabase/functions/api/game.bundle.mjs
          test -z "$(git ls-files -- supabase/functions/api/game.bundle.mjs)"
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck and test generated Edge bundle
        working-directory: supabase/functions/api
        run: |
          deno install
          deno check --node-modules-dir=auto index.ts
          deno test --node-modules-dir=auto --allow-read http.test.ts
          deno test --node-modules-dir=auto --allow-read jwt-deno.test.ts
          deno test --node-modules-dir=auto contention-counter.test.ts
      - name: Check GitHub secret before deployment
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from GitHub Actions Secrets. Bundle and checks succeeded; deployment was NOT attempted."
            exit 1
          fi
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '3.1.0'
      - name: Deploy API with generated bundle (manual only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref rvrwfeblishqadkpzspb --no-verify-jwt
