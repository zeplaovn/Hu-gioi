name: UI mobile verification
on:
  pull_request:
    paths:
      - 'client/**'
      - 'css/**'
      - 'index.html'
      - 'tools/ui-proof.py'
      - 'tools/online-ci-server.cjs'
      - 'server/**'
      - 'tools/ci-server/**'
      - 'tests/helpers/**'
      - 'engine/**'
      - '.github/workflows/ui-verification.yml'
  workflow_dispatch:

concurrency:
  group: hu-gioi-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cài devDependencies theo lockfile (PGlite contract tests)
        run: npm ci
      - name: Kiểm tra hợp đồng nguồn
        run: npm run check
      - name: Chạy toàn bộ test
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Chuẩn bị Playwright dành riêng cho CI
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Chụp trước/sau (cả hai dùng CI API cục bộ + mock Supabase) và kiểm tra file://
        shell: bash
        run: |
          git fetch origin main --depth=1
          git worktree add --detach /tmp/hu-gioi-base origin/main
          (cd /tmp/hu-gioi-base && PORT=8000 node tools/online-ci-server.cjs > /tmp/hu-ui-before.log 2>&1) &
          PORT=8001 node tools/online-ci-server.cjs > /tmp/hu-ui-after.log 2>&1 &
          sleep 3
          # Cả hai site chạy trên CI localhost; ui-proof.py intercept client/config.js
          # và mock toàn bộ Supabase Auth. Không gửi request tới Supabase production.
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/client/config.js
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8001/client/config.js
          python tools/ui-proof.py --before http://127.0.0.1:8000 --after http://127.0.0.1:8001 --output ui-proof
      - name: Lưu ảnh và báo cáo (kể cả khi có lỗi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu-gioi-ui-before-after
          path: ui-proof/
          retention-days: 7
