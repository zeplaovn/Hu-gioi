name: V2 Real Verification
on:
  push:
    branches: [scratch/v2-locks-20261017]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct local snapshot payload
        shell: bash
        run: |
          set -euo pipefail
          cat .scratch-v2-build/chunks/00 \
              .scratch-v2-build/chunks/01 \
              .scratch-v2-build/chunks/02 \
              .scratch-v2-build/chunks/03a \
              .scratch-v2-build/chunks/03b \
              .scratch-v2-build/chunks/03c \
              .scratch-v2-build/chunks/04 | base64 -d > /tmp/v2.tar.gz
          tar -tzf /tmp/v2.tar.gz >/dev/null
          mkdir -p /tmp/v2
          tar -xzf /tmp/v2.tar.gz -C /tmp/v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify Go modules
        working-directory: /tmp/v2/apps/backend
        run: go mod verify
      - name: Go race tests
        working-directory: /tmp/v2/apps/backend
        run: go test -race ./...
      - name: Go vet
        working-directory: /tmp/v2/apps/backend
        run: go vet ./...
      - name: Go production build
        working-directory: /tmp/v2/apps/backend
        run: go build -trimpath -o /tmp/hu-gioi-server ./cmd/server
      - name: PostgreSQL 17 V2 regression
        env:
          PGPASSWORD: postgres
        working-directory: /tmp/v2
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/v2_backend.test.sql
