name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        env:
          TVDL_SALT: ci-only-test-salt-0123456789abcdef
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-public-anon-key-0123456789abcdef
        run: npm run build
