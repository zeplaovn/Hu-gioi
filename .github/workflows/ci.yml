name: CI

on:
  pull_request:
  push:
    branches: [main, rewrite/react-vite-fastify]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test rewrite engine
        run: npm test
      - name: Build React/Vite application
        run: npm run build
