name: CI
on:
  pull_request:
  push:
    branches: [main, rewrite/react-vite-fastify]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test game engine
        run: npm test
      - name: Build React/Vite app
        run: npm run build
