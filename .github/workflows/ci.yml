name: CI
on:
  push: { branches: [main, "feat/**"] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dữ liệu sinh ra khớp data/*.csv
        run: pnpm gen:check
      - name: Nội dung và mốc XP v1.6.1
        run: pnpm test:content
      - name: game-core + web (unit test)
        run: |
          pnpm --filter @hu-gioi/game-core test
          pnpm --filter web test
      - name: Edge Function (handler, mock)
        run: pnpm test:edge
      - name: Database (migration + SQL + parity + handler↔Postgres)
        run: pnpm db:test
      - name: Build web
        run: pnpm build:web

  classic-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Browser for UI verification
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-browser" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/ui-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Classic screenshots and interactions
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ui-browser/node_modules/playwright/index.mjs" node tools/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-ui-screenshots
          path: ui-screenshots/
