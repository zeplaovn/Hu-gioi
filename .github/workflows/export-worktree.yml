name: Export repository

on:
  push:
    branches:
      - rewrite/react-vite-fastify

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create portable Git bundle
        run: git bundle create /tmp/hu-gioi.bundle --all
      - name: Upload repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: hu-gioi-git-bundle
          path: /tmp/hu-gioi.bundle
          if-no-files-found: error
          retention-days: 1
