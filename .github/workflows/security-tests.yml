name: Security regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install supported Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact declared developer tools (lockfile follows in step 3)
        run: npm install --no-package-lock --ignore-scripts
      - name: Generate exact lockfile for review (temporary CI export)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          node - <<'NODE'
          const s = JSON.stringify(require('node:fs').readFileSync('package-lock.json','utf8'));
          for (let i = 0, n = 0; i < s.length; i += 4000, n++)
            console.log('HU_LOCK_CHUNK:' + n + ':' + s.slice(i,i+4000));
          console.log('HU_LOCK_FINISHED');
          NODE
      - name: Verify game source constraints
        run: npm run check
      - name: Run security and integration tests
        run: npm test
      - name: Check built static files contain legal pages but no server source
        shell: bash
        run: |
          npm run build
          npm run build:min
          test -f dist/client/legal/privacy.html
          test -f dist/client/legal/release.html
          test -f dist/client/auth/supabase.js
          test -f dist/_headers
          test ! -d dist/server
          test ! -e dist/.hu-gioi/accounts.json
