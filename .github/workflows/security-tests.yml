name: Security regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install supported Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and run mandatory verification
        run: |
          npm ci
          npm run check && npm test && npm run build:min
      - name: Verify Cloudflare-style production install WITHOUT devDependencies
        env:
          NODE_ENV: production
        run: |
          npm ci --omit=dev
          node -e "require('esbuild')"
          test ! -e node_modules/@electric-sql/pglite/package.json
          npm run build:min
          npm ci --include=dev
      - name: Bundle Edge gameplay and enforce 20MB ceiling
        run: |
          npm run build:edge
          npm run edge:budget
          node tools/bench-service.cjs
      - name: Install Deno for Edge typecheck
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function TypeScript
        working-directory: supabase/functions/api
        run: |
          deno install
          deno check --node-modules-dir=auto index.ts
          deno test --node-modules-dir=auto --allow-read http.test.ts
          deno test --node-modules-dir=auto --allow-read jwt-deno.test.ts
          deno test --node-modules-dir=auto contention-counter.test.ts
          deno run --node-modules-dir=auto --allow-read bench-import.ts
      - name: Smoke Deno.serve HTTP without real DB
        run: node tools/edge-http-smoke.cjs
      - name: Check built static files contain legal pages but no server source
        shell: bash
        run: |
          node tools/build-dist.cjs
          test -f dist/client/legal/privacy.html
          test -f dist/client/legal/release.html
          test -f dist/client/auth/supabase.js
          test -f dist/_headers
          test ! -d dist/server
          test ! -e dist/.hu-gioi/accounts.json
