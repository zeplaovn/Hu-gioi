name: Smoke live Supabase Edge API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify anonymous API rejection and CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          base="https://rvrwfeblishqadkpzspb.supabase.co/functions/v1/api"
          code="$(curl --max-time 20 -sS -o /tmp/edge_get -w '%{http_code}' "$base/bootstrap")"
          echo "GET /bootstrap HTTP: $code"
          head -c 1000 /tmp/edge_get || true
          echo
          options="$(curl --max-time 20 -sS -o /tmp/edge_options -w '%{http_code}' -X OPTIONS "$base/bootstrap" -H 'Origin: https://hugioi.redeyestudio.workers.dev' -H 'Access-Control-Request-Method: POST')"
          echo "OPTIONS /bootstrap HTTP: $options"
          head -c 1000 /tmp/edge_options || true
          echo
          test "$code" = 401 && test "$options" = 204
