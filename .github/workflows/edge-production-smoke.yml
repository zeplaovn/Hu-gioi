name: Probe Edge authorization header handling (safe synthetic JWT)
on:
  push:
    branches: [ops/edge-bundle-deploy-20261110]
    paths: [.github/workflows/edge-production-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test missing and invalid synthetic bearer values, no user tokens
        shell: bash
        run: |
          set -euo pipefail
          base="https://rvrwfeblishqadkpzspb.supabase.co/functions/v1/api/bootstrap"
          echo "=== without Authorization ==="
          curl --max-time 25 -fsS -o /tmp/noauth -w "HTTP %{http_code}\n" "$base" || true
          head -c 400 /tmp/noauth || true
          echo
          echo "=== with syntactically valid but intentionally fake JWT ==="
          curl --max-time 25 -sS -o /tmp/fake -w "HTTP %{http_code}\n" "$base" \
            -H 'Authorization: Bearer abc.def.ghi' -H 'Origin: https://hugioi.blackbearvn.workers.dev'
          head -c 400 /tmp/fake || true
          echo
