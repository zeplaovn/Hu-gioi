<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hư Giới • Kiểm tra sprite nhân vật</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#080f19;color:#ebedf4}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 45% 20%,#1a2d44,transparent 60%),#080f19}
main{width:min(100%,980px);border:1px solid #35445a;border-radius:20px;background:#0a1522bd;box-shadow:0 30px 80px #000b;overflow:hidden}
header{padding:20px 24px 8px}h1{font:500 clamp(24px,4vw,36px) Georgia,serif;color:#e6d3a5;margin:0}header p{color:#9eb3c7;font-size:14px;margin:8px 0 4px}
.controls{padding:12px 24px 18px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}button{border:1px solid #6f819e;border-radius:10px;background:#13283d;color:#edf3ff;padding:10px 13px;font-weight:600;cursor:pointer;min-height:44px}
button[aria-pressed="true"]{border-color:#e6cb91;background:#483e31;color:#ffe6af}button:focus-visible{outline:3px solid #e6cb91;outline-offset:2px}
.group{display:flex;gap:7px;flex-wrap:wrap}label{font-size:13px;color:#abc0d1;white-space:nowrap}
select{background:#172839;border:1px solid #667b94;border-radius:7px;color:white;padding:9px}
.stage{position:relative;min-height:clamp(320px,52vw,540px);background:radial-gradient(ellipse at 50% 70%,#5a6c7688,transparent 45%),linear-gradient(180deg,#15283d 0%,#121b2e 65%,#101922 100%);isolation:isolate;overflow:hidden;display:grid;place-items:center}
.stage:before{content:"";position:absolute;inset:auto 0 0;height:24%;background:radial-gradient(ellipse at 50% 12%,#93b9cb24,transparent 40%),linear-gradient(0deg,#080d17,#1a293b);transform:perspective(500px) rotateX(12deg)}
.stage img{position:relative;width:min(450px,90%);height:min(450px,75vw);min-height:280px;object-fit:contain;filter:drop-shadow(0 18px 15px #000a);image-rendering:auto;z-index:1}
.stage .shadow{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:34%;height:12%;background:radial-gradient(ellipse,#05080c8c,transparent 68%);filter:blur(10px)}
.caption{position:absolute;top:15px;left:20px;font:700 12px system-ui;color:#cbd6ed;letter-spacing:2px;z-index:2}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 24px;font-size:13px;color:#aebdd0;background:#0a1421;flex-wrap:wrap}
.status strong{color:#e6d3a5}#error{color:#ffb8aa}
@media(max-width:640px){.controls{padding-inline:12px}header{padding-inline:14px}.status{padding-inline:14px}.stage{min-height:410px}.stage img{height:390px}}
</style></head>
<body><main><header><h1>Hư Giới · Đạo thân</h1><p>Kiểm tra 4 chuyển động nam/nữ từ bộ player.zip. Khung hình WebP có nền alpha thật.</p></header>
<div class="controls"><div class="group" role="group" aria-label="Giới tính"><button data-gender="nam" aria-pressed="true">Nam</button><button data-gender="nu" aria-pressed="false">Nữ</button></div>
<div class="group" role="group" aria-label="Hành động"><button data-action="thien_dinh" aria-pressed="true">☯ Ngồi thiền</button><button data-action="di_bo" aria-pressed="false">Đi bộ</button><button data-action="tung_skill" aria-pressed="false">⚡ Tung skill</button><button data-action="guc_nga" aria-pressed="false">Gục ngã</button></div>
<label>Nhịp <select id="speed"><option value="1">100%</option><option value="0.75">Chậm 75%</option><option value="1.25">Nhanh 125%</option></select></label>
<button id="pause" aria-pressed="false">Tạm dừng</button></div>
<div class="stage" aria-label="Xem trước animation nhân vật"><div class="caption" id="caption">TU LUYỆN</div><div class="shadow" aria-hidden="true"></div><img id="character" width="512" height="512" alt="Nhân vật nam ngồi thiền" loading="eager"></div>
<div class="status"><span><strong id="frame">01 / 06</strong> · khung hình · PNG gốc 512×512, WebP tối ưu</span><span id="note">Thử chuyển nhân vật hoặc động tác.</span><span id="error" role="status"></span></div></main>
<script>
(() => {
'use strict';
const ROOT='../media/assets/chars/player/realistic/';
const MAP={nam:{thien_dinh:250,di_bo:170,tung_skill:155,guc_nga:200},nu:{thien_dinh:180,di_bo:150,tung_skill:140,guc_nga:220}};
const LABELS={thien_dinh:'TU LUYỆN · NHẬP ĐỊNH',di_bo:'DẠO BƯỚC',tung_skill:'LINH KHÍ PHÁT ĐỘNG',guc_nga:'THỌ NGUYÊN / GỤC NGÃ'};
const img=document.querySelector('#character'), frame=document.querySelector('#frame'),status=document.querySelector('#note'),error=document.querySelector('#error');
let gender='nam', action='thien_dinh', start=performance.now(), paused=false, pausedAt=0, speed=1, current=-1, loaded=new Map();
const path=(g,a,i)=>`${ROOT}${g}/${a}/${String(i).padStart(2,'0')}.webp`;
async function preload(g,a){const k=`${g}/${a}`;if(loaded.has(k))return loaded.get(k);const p=Promise.all(Array.from({length:6},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Không tìm thấy '+path(g,a,i)));im.src=path(g,a,i)})));loaded.set(k,p);return p;}
async function change(){start=performance.now();current=-1;error.textContent='';document.querySelector('#caption').textContent=LABELS[action];document.querySelectorAll('[data-gender]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.gender===gender)));document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===action)));status.textContent=action==='guc_nga'?'Gục ngã phát một lần, giữ ở khung cuối.':'Animation lặp theo đúng nhịp khung hình.';try{await preload(gender,action)}catch(e){error.textContent=e.message}}
document.querySelectorAll('[data-gender]').forEach(b=>b.addEventListener('click',()=>{gender=b.dataset.gender;change()}));
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{action=b.dataset.action;change()}));
document.querySelector('#speed').addEventListener('change',e=>{speed=Number(e.target.value);start=performance.now()});
document.querySelector('#pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'Phát tiếp':'Tạm dừng';e.currentTarget.setAttribute('aria-pressed',String(paused));if(paused)pausedAt=performance.now();else start+=performance.now()-pausedAt});
function loop(now){const duration=MAP[gender][action]/speed;const n=Math.min(5,Math.floor((paused?pausedAt-start:now-start)/duration));const index=action==='guc_nga'?Math.max(0,n):((Math.floor((paused?pausedAt-start:now-start)/duration)%6)+6)%6;if(index!==current){current=index;img.src=path(gender,action,index);img.alt=`Nhân vật ${gender==='nu'?'nữ':'nam'} ${LABELS[action].toLowerCase()}`;frame.textContent=String(index+1).padStart(2,'0')+' / 06'}requestAnimationFrame(loop)}
change();requestAnimationFrame(loop);
})();
</script></body></html>
