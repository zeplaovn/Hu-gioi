# Local/VM deployment: access via HTTPS reverse proxy (Caddy/Nginx/Cloudflare Tunnel).
# Set SUPABASE_PUBLISHABLE_KEY in the runtime environment, not in this file.
services:
  hugioi:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      SUPABASE_URL: ${SUPABASE_URL:?Missing Supabase URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Missing publishable key}
      HU_DB_FILE: /data/game.sqlite
      HU_AUTH_TRUSTED_PROXY_IPS: ${HU_AUTH_TRUSTED_PROXY_IPS:?Set the actual reverse proxy source IP}
    volumes:
      - hugioi_player_data:/data
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  hugioi_player_data:
