<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09100e">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'none'; connect-src 'none'; object-src 'none'; worker-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'">
  <meta name="referrer" content="no-referrer">
  <title>Bảo trì - Thiên Vân Đại Lục</title>
  <link rel="icon" href="assets/icons/orb_gold_22.png">
  <link rel="stylesheet" href="styles/standalone.css">
</head>
<body>
  <main class="sp-card" role="main">
    <div class="sp-seal" aria-hidden="true">天</div>
    <div class="sp-eyebrow">THIÊN VÂN ĐẠI LỤC</div>
    <h1>Thiên Đạo tạm phong bế</h1>
    <p id="reason" role="status">Máy chủ đang bảo trì. Vui lòng quay lại sau.</p>
    <small>Game sẽ tự mở lại khi bảo trì kết thúc. Tiến trình của bạn được giữ nguyên.</small>
    <small id="sub"></small>
    <button type="button" id="retry" class="sp-btn">Kiểm tra lại</button>
  </main>
  <script src="src/services/config.js"></script>
  <script src="src/standalone/boot.js"></script>
  <script src="src/standalone/maintenance.js"></script>
</body>
</html>
